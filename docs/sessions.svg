<svg xmlns="http://www.w3.org/2000/svg" width="400" height="360" viewBox="0 0 400 360" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Session button -->
  <rect x="20.5" y="8.5" width="160" height="33" rx="6" fill="#FFFFFF" stroke="#D0D7DE"/>
  <text x="32" y="30" font-size="13.5" fill="#24292F">📂 <tspan font-weight="600">Clientes marzo</tspan></text>
  <text x="164" y="29" font-size="10" fill="#57606A">▾</text>

  <!-- Panel -->
  <rect x="20" y="52" width="360" height="292" rx="10" fill="#FFFFFF" stroke="#D0D7DE" filter="url(#shadow)"/>
  <text x="36" y="82" font-size="11" font-weight="600" fill="#57606A">SESIONES</text>
  <rect x="284" y="64" width="82" height="28" rx="6" fill="#0969DA"/>
  <text x="325" y="83" font-size="13" fill="#FFFFFF" text-anchor="middle">＋ Nueva</text>

  <!-- Open session -->
  <rect x="28" y="104" width="344" height="72" rx="8" fill="#F0F6FF"/>
  <rect x="34" y="113" width="3" height="54" rx="2" fill="#0969DA"/>
  <text x="46" y="128" font-size="14" font-weight="600" fill="#24292F">Clientes marzo</text>
  <rect x="290" y="115" width="68" height="18" rx="9" fill="#DDF4FF"/>
  <text x="324" y="128" font-size="10.5" font-weight="600" fill="#0969DA" text-anchor="middle">ABIERTA</text>
  <rect x="46" y="140" width="312" height="6" rx="3" fill="#EAEEF2"/>
  <rect x="46" y="140" width="218" height="6" rx="3" fill="#2DA44E"/>
  <text x="46" y="166" font-size="12" fill="#57606A">7 de 10 · hoy</text>

  <!-- Hovered session with actions -->
  <rect x="28" y="182" width="344" height="72" rx="8" fill="#F6F8FA"/>
  <text x="46" y="206" font-size="14" font-weight="600" fill="#24292F">Contratos abril</text>
  <text x="318" y="206" font-size="13" fill="#57606A">✏️</text>
  <text x="342" y="206" font-size="13" fill="#57606A">🗑</text>
  <rect x="46" y="218" width="312" height="6" rx="3" fill="#EAEEF2"/>
  <rect x="46" y="218" width="42" height="6" rx="3" fill="#2DA44E"/>
  <text x="46" y="244" font-size="12" fill="#57606A">2 de 15 · ayer</text>

  <!-- Completed session -->
  <text x="46" y="284" font-size="14" font-weight="600" fill="#24292F">Mi sesión</text>
  <rect x="270" y="271" width="88" height="18" rx="9" fill="#DAFBE1"/>
  <text x="314" y="284" font-size="10.5" font-weight="600" fill="#1A7F37" text-anchor="middle">✔ COMPLETA</text>
  <rect x="46" y="296" width="312" height="6" rx="3" fill="#2DA44E"/>
  <text x="46" y="322" font-size="12" fill="#57606A">10 de 10 · 20 sep</text>
</svg>
